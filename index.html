<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Date Request ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #ff4d6d; margin-bottom: 10px; }
        h2 { color: #c9184a; margin-bottom: 15px; }
        p { color: #555; line-height: 1.5; }

        .btn-group {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }

        button:hover { background-color: #c9184a; }

        #noBtn {
            background-color: #8d99ae;
            box-shadow: 0 4px 10px rgba(141, 153, 174, 0.3);
            transition: 0.1s ease;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ffccd5;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: #ff4d6d;
        }

        .gif-container img {
            width: 150px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .love-msg {
            font-size: 18px;
            color: #ff4d6d;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Page 1: Welcome & Permission -->
        <div id="page1" class="page active">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3I3bmI0Z3Eydnp2Z2M4ZXZyN204YzhzcWptcjVnMGd0cXd5aXMxZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LbfT59dQmcM2A/giphy.gif" alt="Cute Cat">
            </div>
            <h1>Hey Beautiful! ✨</h1>
            <p>Tumi ki amar sathe ekta chotto date-e jabe?</p>
            <div class="btn-group">
                <button id="yesBtn" onclick="nextPage(2)">Yes! 💖</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😜</button>
            </div>
        </div>

        <!-- Page 2: Date Details Form -->
        <div id="page2" class="page">
            <h2>Yay! 🎉 Date Details Fix Kori!</h2>
            
            <form id="dateForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>📅 Date & Time Select Karo:</label>
                    <input type="datetime-local" id="dateTime" name="Date_and_Time" required>
                </div>

                <div class="form-group">
                    <label>📍 Location Choose Karo:</label>
                    <select id="location" name="Location">
                        <option value="Cozy Cafe ☕">Cozy Cafe ☕</option>
                        <option value="Rooftop Restaurant 🌃">Rooftop Restaurant 🌃</option>
                        <option value="Park Walk & Street Food 🍦">Park Walk & Street Food 🍦</option>
                        <option value="Movie & Dinner 🎬">Movie & Dinner 🎬</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>🍔 Ki Khabe Bolo?</label>
                    <input type="text" id="food" name="Food_Preference" placeholder="Jemon: Pizza, Pasta, Coffee..." required>
                </div>

                <div class="form-group">
                    <label>👗 Dress Code / Color preference:</label>
                    <input type="text" id="dress" name="Dress_Code" placeholder="Jemon: Matching Blue, Black...">
                </div>

                <button type="submit" id="submitBtn">Confirm Date ✨</button>
            </form>
        </div>

        <!-- Page 3: Final Greeting -->
        <div id="page3" class="page">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3p0eGNmcm81YXkzdXR2ZTNndmxieWFwbTFveWthYmsxdmRwMnF4eiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26hpW3S69BInLscg/giphy.gif" alt="Happy Cute">
            </div>
            <h1>It's a Date! 🥰🌸</h1>
            <p>Amar kachhe sob details pouche geche!</p>
            <p class="love-msg">See you soon, my love! ❤️</p>
        </div>
    </div>

    <script>
        // Formspree Endpoint Link Connected
        const FORMSPREE_URL = "https://formspree.io/f/meeyvvoj";

        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('page' + pageNumber).classList.add('active');
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(20, x)}px`;
            noBtn.style.top = `${Math.max(20, y)}px`;
        }

        function submitForm(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Sending... 💖";
            submitBtn.disabled = true;

            const formData = new FormData(document.getElementById('dateForm'));

            fetch(FORMSPREE_URL, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    nextPage(3);
                } else {
                    alert("Opps! Somoshya hocche, abar try karo.");
                    submitBtn.innerText = "Confirm Date ✨";
                    submitBtn.disabled = false;
                }
            }).catch(error => {
                alert("Network error!");
                submitBtn.innerText = "Confirm Date ✨";
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
